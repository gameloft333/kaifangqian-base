server {
    listen 8806;
    server_name _;

    client_max_body_size 100M;

    # ── Gzip 压缩 ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # ── WebSocket 代理 ─────────────────────────────────────────────
    location /resrun-paas/websocket {
        proxy_pass http://kq-backend:8899;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API 代理 ───────────────────────────────────────────────────
    location /resrun-paas {
        proxy_pass http://kq-backend:8899/resrun-paas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 签署主应用 (默认) ──────────────────────────────────────────
    location / {
        root /data/opensign-web;
        index index.html index.htm;
        try_files $uri $uri/ $uri.html /index.html;
    }

    # ── 企业管理端 ─────────────────────────────────────────────────
    location /manage {
        alias /data/opensign-manage;
        index index.html index.htm;
        try_files $uri $uri/ $uri.html /manage/index.html;
    }

    # ── 租户管理 ───────────────────────────────────────────────────
    location /tenant {
        alias /data/opensign-tenant;
        index index.html index.htm;
        try_files $uri $uri/ $uri.html /tenant/index.html;
    }

    # ── 消息服务 ───────────────────────────────────────────────────
    location /message {
        alias /data/opensign-message;
        index index.html index.htm;
        try_files $uri $uri/ $uri.html /message/index.html;
    }

    # ── 移动端 ─────────────────────────────────────────────────────
    location /mobile {
        alias /data/opensign-mobile;
        index index.html index.htm;
        try_files $uri $uri/ $uri.html /mobile/index.html;
    }

    # ── 静态资源缓存 ──────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /data/opensign-web;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
